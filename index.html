<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rio Elite Concierge - Servizi esclusivi su misura.">
  <title>Rio Elite Concierge</title>

  <style>
    :root {
      color-scheme: dark;
      --gold: #d4af37;
      --gold-light: #f0cb57;
      --ink: #0b0b0d;
      --panel: rgba(19, 19, 23, 0.78);
      --muted: #b7b7be;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(212, 175, 55, 0.20), transparent 31%),
        radial-gradient(circle at 85% 85%, rgba(212, 175, 55, 0.10), transparent 28%),
        var(--ink);
      color: #ffffff;
    }

    header {
      width: min(1200px, calc(100% - 48px));
      margin: 0 auto;
      padding: 26px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .logo {
      color: #ffffff;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.25rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .logo span {
      color: var(--gold);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    nav a {
      color: var(--muted);
      font-size: 0.9rem;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--gold);
    }

    .hero {
      width: min(1200px, calc(100% - 48px));
      min-height: calc(100vh - 104px);
      margin: 0 auto;
      display: grid;
      place-items: center;
      padding: 48px 0 88px;
    }

    .hero-content {
      width: min(850px, 100%);
      padding: 68px 42px;
      text-align: center;
      background: var(--panel);
      border: 1px solid rgba(212, 175, 55, 0.55);
      border-radius: 20px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.5);
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--gold);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.8rem, 8vw, 6rem);
      font-weight: 500;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .line {
      width: 76px;
      height: 2px;
      margin: 32px auto;
      background: var(--gold);
    }

    .description {
      max-width: 600px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.14rem);
      line-height: 1.75;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 36px;
    }

    .button {
      display: inline-block;
      padding: 14px 24px;
      border: 1px solid var(--gold);
      border-radius: 4px;
      color: #111111;
      background: var(--gold);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .button:hover {
      background: var(--gold-light);
    }

    .button-outline {
      color: var(--gold);
      background: transparent;
    }

    .button-outline:hover {
      color: #111111;
      background: var(--gold);
    }

    footer {
      padding: 26px 24px 34px;
      color: #81818a;
      font-size: 0.84rem;
      text-align: center;
    }

    @media (max-width: 640px) {
      header {
        width: min(100% - 32px, 1200px);
        padding: 20px 0;
      }

      nav {
        display: none;
      }

      .hero {
        width: min(100% - 32px, 1200px);
        min-height: calc(100vh - 78px);
        padding: 24px 0 48px;
      }

      .hero-content {
        padding: 52px 24px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="#home">
      Rio Elite <span>Concierge</span>
    </a>

    <nav aria-label="Navigazione principale">
      <a href="#home">Home</a>
      <a href="#servizi">Servizi</a>
      <a href="#contatti">Contatti</a>
    </nav>
  </header>

  <main id="home" class="hero">
    <section class="hero-content">
      <p class="eyebrow">Exclusive Services</p>

      <h1>
        Rio Elite<br>
        Concierge
      </h1>

      <div class="line"></div>

      <p class="description">
        Esperienze, assistenza e servizi esclusivi pensati su misura.
        Il nostro nuovo sito è in arrivo.
      </p>

      <div class="actions">
        <a class="button" href="mailto:rioeliteconsierge@gmail.com">
          Contattaci
        </a>

        <a class="button button-outline" href="#servizi">
          Scopri i servizi
        </a>
      </div>
    </section>
  </main>

  <footer id="contatti">
    © 2026 Rio Elite Concierge · Tutti i diritti riservati
  </footer>
</body>

</html>
